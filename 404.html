<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidan finns inte | Danderyds Mekaniska</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{
  font-family:'Geist'; font-style:normal; font-weight:100 900;
  font-display:swap; src:url('/fonts/geist.woff2') format('woff2');
}
@font-face{
  font-family:'Geist Mono'; font-style:normal; font-weight:100 900;
  font-display:swap; src:url('/fonts/geist-mono.woff2') format('woff2');
}
:root{
  color-scheme:light dark;
  --paper:#faf8f5; --ink:#1a1a18; --muted:#5e594f; --rule:#ded7cb; --accent:#a8431c;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141412; --ink:#eae5dd; --muted:#a39c90; --rule:#332f29; --accent:#e2794a}
}
body{
  margin:0; background:#faf8f5; background:var(--paper); color:#1a1a18; color:var(--ink);
  font-family:"Segoe UI",Arial,sans-serif; font-family:var(--sans); line-height:1.65;
}
main{display:block; max-width:40rem; margin:0 auto; padding:5rem 1.5rem}
.label{font-family:var(--mono); font-size:.75rem; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--accent); margin:0 0 1.25rem}
h1{font-size:2rem; line-height:1.15; letter-spacing:-.02em; margin:0 0 1rem}
p{margin:0 0 1rem; color:var(--muted)}
a{color:var(--ink); text-underline-offset:4px; text-decoration-color:var(--rule)}
a:hover, a:focus-visible{text-decoration-color:var(--accent)}
.tel{font-family:var(--mono); font-weight:700; white-space:nowrap}
</style>
</head>
<body>
<main>
  <p class="label">404</p>
  <h1>Sidan finns inte</h1>
  <p>Adressen du följde leder ingenstans. Den gamla webbplatsen är nedlagd, och allt finns nu på en sida.</p>
  <p><a href="/">Till startsidan</a>, eller ring <a class="tel" href="tel:+46707773230">0707-773 230</a>.</p>
</main>
</body>
</html>
